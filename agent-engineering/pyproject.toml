[project]
name = "agent-engineering"
version = "0.1.0"
description = "Hands-on curriculum and build artifacts for senior agent engineering"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Bojan Skrchevski", email = "bojan@asleekgeek.com" },
]
# The root project is a workspace orchestrator — it has no runtime deps of its own.
# Each phase declares what it actually needs.
dependencies = []

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "phases/01-foundations",
    "phases/02-context-engineering",
    "phases/03-single-agent",
    "phases/04-multi-agent",
    "phases/05-frameworks/sdk_impl",
    "phases/05-frameworks/langgraph_impl",
    "phases/06-evals",
    "phases/07-production",
    "phases/08-synthesize",
    "shared",
]

[tool.uv.sources]
agent-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/.venv", "**/node_modules"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C90",  # mccabe complexity
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts in tests

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = false
include = ["phases", "shared"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["phases", "shared"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "live_api: tests that hit a real LLM API (skipped unless ANTHROPIC_API_KEY is set)",
    "eval: long-running eval suite (skipped in default test run)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["phases", "shared"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
