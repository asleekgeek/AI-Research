[project]
name = "agent-shared"
version = "0.1.0"
description = "Cross-phase utilities for the agent-engineering curriculum"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_shared"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
