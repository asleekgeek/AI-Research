[project]
name = "phase-01-foundations"
version = "0.1.0"
description = "Hand-rolled ReAct agent on the Anthropic Messages API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "agent-shared",
]

[project.scripts]
react-agent = "react_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_agent"]
