[project]
name = "phase-03-single-agent"
version = "0.1.0"
description = "Obsidian Vault Curator — a polished single sophisticated agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9.0",
    "agent-shared",
]

[project.scripts]
vault-curator = "vault_curator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_curator"]
