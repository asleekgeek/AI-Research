[project]
name = "phase-07-production"
version = "0.1.0"
description = "Production-hardened cluster validation agent — HITL, durability, injection defense"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "claude-agent-sdk>=0.1.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pydantic>=2.9.0",
    "kubernetes>=31.0.0",
    "agent-shared",
]

[project.scripts]
validator = "validator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]
