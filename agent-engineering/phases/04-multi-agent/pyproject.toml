[project]
name = "phase-04-multi-agent"
version = "0.1.0"
description = "Research → Write → Critique pipeline (orchestrator-worker)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.9.0",
    "agent-shared",
]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]
