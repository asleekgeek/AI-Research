[project]
name = "phase-06-evals"
version = "0.1.0"
description = "Eval kit — golden sets, code assertions, LLM-as-judge, regression gating"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "agent-shared",
]

[project.scripts]
eval-kit = "eval_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_kit"]
