[project]
name = "phase-02-context-engineering"
version = "0.1.0"
description = "Context engineering — caching, compaction, scratchpad files"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "agent-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_agent"]
