[project]
name = "phase-05-frameworks-langgraph"
version = "0.1.0"
description = "Phase 4 pipeline implemented on LangGraph"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pydantic>=2.9.0",
    "agent-shared",
]

[project.scripts]
langgraph-pipeline = "langgraph_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_pipeline"]
